          <text x="16" y="200" font-family="Verdana,sans-serif" font-size="9"
                fill="#939FB4">99 480</text>

          <!-- paticka -->
          <rect x="10" y="204" width="300" height="30" rx="10" fill="#000" opacity=".34"/>
          <text x="20"  y="223" font-family="Verdana,sans-serif" font-size="11"
                fill="#CBD4E3">24h max  105 900</text>
          <text x="166" y="223" font-family="Verdana,sans-serif" font-size="11"
                fill="#CBD4E3">24h min  99 480</text>
          <text x="300" y="223" text-anchor="end" font-family="Verdana,sans-serif"
